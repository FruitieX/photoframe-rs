[package]
name = "photoframe-server"
version = "0.1.0"
edition = "2024"

[dependencies]
toml_edit = { version = "=0.25.17+spec-1.1.0", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
anyhow = "=1.0.104"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = [
	"rt-multi-thread",
	"macros",
	"fs",
	"io-util",
	"sync",
] }
axum = { version = "=0.8.9", features = ["json", "multipart"] }
tower-http = { version = "=0.7.1", features = ["cors", "trace"] }
tokio-cron-scheduler = "=0.15.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter"] }
croner = { version = "=4.0.2", features = ["serde"] }
glob = "=0.3.4"
rand = { version = "=0.10.3", features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = [
	"png",
	"jpeg",
] }
async-trait = "=0.1.92"
parking_lot = "=0.13.0"
reqwest = { version = "=0.13.5", default-features = false, features = [
	"json",
	"rustls",
	"multipart",
] }
css-color = "=0.2.8"
once_cell = "=1.21.4"
kamadak-exif = "=0.6.1"
mime_guess = "=2.0.5"
rust-embed = { version = "=8.13.0", optional = true, features = [
	"debug-embed",
	"include-exclude",
] }
mime = "=0.3.17"
rusttype = "=0.9.3"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"

[features]
default = ["embed_ui"]
embed_ui = ["dep:rust-embed"]
