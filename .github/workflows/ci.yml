name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-server
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --all --locked

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy -- -D warnings

  build-image:
    name: Build & (optionally) push image
    runs-on: ubuntu-latest
    needs: [check, test, fmt, clippy]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 'latest'
          cache: 'npm'
          cache-dependency-path: photoframe-nextjs/package-lock.json

      - name: Install Next.js dependencies
        run: npm ci --prefix photoframe-nextjs

      - name: Lint Next.js app
        run: npm run lint --prefix photoframe-nextjs

      - name: Build Next.js app
        run: npm run build --prefix photoframe-nextjs

      - name: Typecheck Next.js app
        run: npm run typecheck --prefix photoframe-nextjs

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build binary (musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: photoframe:ci

      # Gates PRs (incl. Renovate automerges) and main before publishing: boots the
      # image with a dummy frame fed from a local folder, renders an image through the
      # pipeline and loads the UI in headless Chrome, failing on any console output.
      - name: Smoke test image
        run: |
          docker run -d --rm -p 8080:8080 --name photoframe \
            -v "$PWD/.github/smoke/photoframe.toml:/app/photoframe.toml:ro" \
            -v "$PWD/.github/smoke:/photos:ro" photoframe:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/live
          curl -fsS http://127.0.0.1:8080/api/config | grep -q '"smoke"'
          curl -fsS -X POST http://127.0.0.1:8080/api/frames/smoke/trigger
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/api/frames/smoke/metadata && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/api/frames/smoke/metadata
          curl -fsS -X POST -H 'content-type: application/json' -d '{}' \
            -o "$RUNNER_TEMP/preview.png" http://127.0.0.1:8080/api/frames/smoke/preview
          file "$RUNNER_TEMP/preview.png" | grep -q 'PNG image data'
          for page in / /frames /sources; do
            google-chrome --headless=new --no-sandbox --enable-logging=stderr --v=0 \
              --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8080$page" \
              > "$RUNNER_TEMP/dom.html" 2> "$RUNNER_TEMP/chrome.log"
            grep -q 'photoframe-rs' "$RUNNER_TEMP/dom.html"
            if grep ':CONSOLE' "$RUNNER_TEMP/chrome.log"; then exit 1; fi
          done
          docker stop photoframe

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to homelab
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip superseded builds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "A newer commit exists on main, skipping deployment of this build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to homelab
        if: steps.check.outputs.enabled == 'true'
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          repository: FruitieX/homelab
          event-type: image-update
          client-payload: |
            {
              "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",
              "digest": "${{ needs.build-image.outputs.digest }}",
              "revision": "${{ github.sha }}"
            }
